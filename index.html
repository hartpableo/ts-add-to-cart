<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>TypeScript: Add-to-cart</title>
  <style>
    #products-list {
      margin-block: 1rem;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: .75rem;
    }

    .product {
      border: 1px solid currentColor;
      background: transparent;
      padding: .5em;
      font-size: 1rem;
      grid-column: span 2;
    }

    .product img {
      object-fit: contain;
      height: auto;
      width: 100%;
    }
  </style>
  <script src="./src/index.ts" type="module" defer></script>
</head>
<body>
<header></header>

<main>
  <div id="products-list"></div>
</main>

<template id="product-tpl">
  <article class="product">
    <img data-slot="image" width="450" height="225" decoding="async" loading="lazy">
    <h3 data-slot="name"></h3>
    <p data-slot="price"></p>
    <p data-slot="category"></p>
    <div data-slot="desc"></div>
    <button type="button" class="js-add-to-cart">
      Add to cart
    </button>
  </article>
</template>

<template id="cart-tpl">
  <div class="cart">
    <p><strong>Your cart:</strong></p>
    <ul data-slot="items"></ul>
    <button type="button" class="js-remove-items">Remove items</button>
    <button type="button" class="js-proceed-checkout">Proceed to checkout</button>
  </div>
</template>

</body>
</html>
