<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>TypeScript: Add-to-cart</title>
  <style>
    #products-list {
      margin-block: 1rem;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: .75rem;
    }

    .product {
      border: 1px solid currentColor;
      background: transparent;
      padding: .5em;
      font-size: 1rem;
      grid-column: span 2;
    }

    .product img {
      object-fit: contain;
      height: auto;
      width: 100%;
    }
  </style>
  <script src="./src/index.ts" type="module" defer></script>
</head>
<body>
<header>
  <button type="button" class="js-cart" aria-label="Your cart">
    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
         class="bi bi-cart" viewBox="0 0 16 16">
      <path
        d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
    </svg>
  </button>
</header>

<main>
  <div id="products-list"></div>
</main>

<template id="product-tpl">
  <article class="product">
    <img data-slot="image" width="450" height="225" decoding="async" loading="lazy">
    <h3 data-slot="name"></h3>
    <p data-slot="price"></p>
    <p data-slot="category"></p>
    <div data-slot="desc"></div>
    <button type="button" class="js-add-to-cart">
      Add to cart
    </button>
  </article>
</template>

</body>
</html>
